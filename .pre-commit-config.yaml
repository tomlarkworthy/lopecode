# Keeps each notebook's sibling .json spec in step with its HTML.
#
# The spec's per-module `hash` is a real content md5, but nothing maintains it
# after export: sync-module has no spec handling, and save-in-place writes a
# single file through a FileSystemFileHandle so it cannot touch a sibling.
# The commit boundary is the one point every writer passes through, so the
# invariant "in committed history, spec.hash matches the block" is established
# here rather than by any individual writer.
#
# The same applies to `bootconf`, and it is the half other tools READ:
# lope-jumpgate.js takes `mains` and `hash` from the spec to decide what to
# re-export. Left unmaintained it went badly wrong -- on 2026-08-13, 187 of 229
# specs recorded different `mains` than their own HTML, so a jumpgate
# regeneration silently dropped mains and downgraded the frame. `theme` is the
# one key the HTML cannot carry (the exporter never writes one into the block),
# so spec-sync preserves it rather than overwriting.
#
# A notebook with no sibling spec FAILS rather than being skipped: otherwise
# every new notebook silently opts out of the invariant. Mint one with
#   bun tools/lope-sync.ts spec-sync --rebuild notebooks/<name>.html
# The hook only sees the notebooks being committed, so a pre-existing gap
# surfaces when that notebook is next touched, not on unrelated commits.
#
# The tool lives in the parent lopecode-dev repo; when this repo is cloned
# standalone the hook no-ops rather than failing.
repos:
  - repo: local
    hooks:
      # Does every module a notebook embeds actually provide what the others import?
      #
      # This class of defect reached users. On 2026-08-16 a @tomlarkworthy/lopepage-2 sweep
      # bumped the module across the corpus but left coded-landmark-tracking's embedded
      # @tomlarkworthy/lopepage-urls one revision behind, without `navigate`. An unresolved
      # import is never DELIVERED, so nothing throws: lp2_renderTab never ran, the mount never
      # completed, and because that notebook sets prerender:true the page painted and then went
      # blank. One notebook of 232, found by a user report rather than by us (fix 9bd62858).
      # Run against the pre-fix file, preflight names it directly:
      #   missing-export  @tomlarkworthy/lopepage-2 imports navigate from
      #                   @tomlarkworthy/lopepage-urls, which does not define it
      #
      # Only findings in the boot closure gate; `-lazy` ones belong to modules nothing imports,
      # so they never run. Static only -- preflight has a --boot layer that really instantiates
      # each notebook, but that is ~60min over the corpus and cannot sit in a commit.
      #
      # Cost, measured 2026-08-17 from this directory: 0.076s for one notebook, 0.229s for
      # eight. It parses blocks and compares names; it boots nothing.
      #
      # Runs first because it only reads. lope-spec-sync below REWRITES spec files, and a
      # commit that is going to fail anyway should not leave those rewrites behind.
      #
      # Scope is the notebooks being committed, the same limit lope-spec-sync has: a notebook
      # that goes stale because a DIFFERENT notebook's canonical moved is not checked until it
      # is itself touched -- which is exactly how the lopepage-urls bug escaped, so this hook
      # would not have caught it either. What catches that is the corpus sweep,
      # `bun tools/lope-preflight.ts`, gated differentially against
      # tools/preflight-baseline.json. That baseline was cut from 691 entries to 0 on
      # 2026-08-17, when the corpus first reached zero findings, so any finding is now new.
      - id: lope-preflight
        name: notebook module graph resolves
        entry: sh -c 'test -f ../tools/lope-preflight.ts || exit 0; exec bun ../tools/lope-preflight.ts "$@"' --
        language: system
        files: ^notebooks/.*\.html$
        pass_filenames: true

      - id: lope-spec-sync
        name: notebook spec hashes + bootconf
        entry: sh -c 'test -f ../tools/lope-sync.ts || exit 0; exec bun ../tools/lope-sync.ts spec-sync "$@"' --
        language: system
        files: ^notebooks/.*\.html$
        pass_filenames: true

      # A notebook Google never fetches is a notebook that does not exist, and the only crawl path
      # to most of these is the sitemap. Adding one is the moment it gets forgotten, so the check
      # sits here. It compares the URL SET only -- `lastmod` is a git commit date, which at
      # pre-commit time still reads the previous commit and would flag every fresh notebook
      # forever. Deletions do not trigger it (pre-commit filters to added/modified paths); a
      # removed notebook surfaces on the next commit that touches any notebook.
      - id: lope-sitemap
        name: sitemap lists every notebook
        entry: sh -c 'test -f ../tools/build-sitemaps.ts || exit 0; exec bun ../tools/build-sitemaps.ts --check --only lopecode'
        language: system
        files: ^notebooks/.*\.html$
        pass_filenames: false
