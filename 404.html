<!-- Legacy compatibility shim. Notebooks were renamed from `@user_name.html` to
     `user_name.html`; GitHub Pages offers no server-side redirects, so old links
     land here and are rewritten client-side. Preserves ?search and #hash (the
     lopecode layout DSL lives in the fragment). Note: the browser still receives
     HTTP 404 before this runs, so fetch()/crawlers are not redirected. -->
<meta charset="utf-8">
<title>Redirecting…</title>
<script>
(() => {
  const p = decodeURIComponent(location.pathname);
  const i = p.lastIndexOf('/@');
  if (i >= 0) location.replace(
    p.slice(0, i + 1) + p.slice(i + 2) + location.search + location.hash
  );
})();
</script>
<p>Not found. Notebooks no longer carry a leading <code>@</code> — try the same
URL without it.</p>
