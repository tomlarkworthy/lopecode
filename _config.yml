# GitHub Pages builds this repo with the legacy Jekyll pipeline (source: main /).
# `design/` is the design-system package — npm source consumed by `/design-sync`
# and by `npm ci` clones, never served over HTTP. Its component docs contain
# literal `{{ … }}`, which Liquid tries to parse and dies on:
#   Liquid Exception: Variable '{{ title: (I) => I.text({ label: "Title" …'
#   was not properly terminated in design/ds-bundle/components/general/Form/Form.prompt.md
# That broke every Pages deploy from 2026-08-29 onward, freezing the published
# notebooks at the last green build.
#
# Jekyll's `exclude` REPLACES its defaults, so the stock entries are repeated here.
exclude:
  - design
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor/bundle/
  - vendor/cache/
  - vendor/gems/
  - vendor/ruby/
